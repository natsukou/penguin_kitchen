[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pet-meal-robotics"
version = "0.2.0"
description = "Galbot G1 pet meal orchestration with an explicitly simulated RGB-D baseline"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24,<3", "opencv-python>=4.8,<6"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
vision = ["ultralytics>=8,<9"]

[project.scripts]
pet-meal = "pet_meal.cli:main"

[tool.setuptools.packages.find]
include = ["pet_meal*"]

[tool.setuptools.package-data]
pet_meal = [
    "ui/*.html", "ui/*.css", "ui/*.js",
    "ui/images/*.webp",
    "ui/nutrition_ui/*.html", "ui/nutrition_ui/*.css", "ui/nutrition_ui/*.js",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
